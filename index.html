<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a0e">
<meta name="description" content="Ficha de treino, sugestão de carga, avaliações e fotos de evolução.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus Treinos">
<title>Meus Treinos</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="no-nav">
<main id="app" aria-live="polite"></main>

<button class="live" id="live" data-a="go" data-v="sessao" hidden><span class="dot"></span><span id="live-txt">Treino em andamento</span></button>

<nav class="nav" aria-label="Seções">
  <div class="nav-in">
    <button data-a="go" data-v="hoje" id="nav-hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Hoje</button>
    <button data-a="go" data-v="treinos" id="nav-treinos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Treinos</button>
    <button data-a="go" data-v="familia" id="nav-familia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.5 14.6c2.6-.4 4.6 1.2 5 4.4"/></svg>Família</button>
    <button data-a="go" data-v="evolucao" id="nav-evolucao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17l5-5 4 3 7.5-8"/><path d="M15 7h5v5"/></svg>Evolução</button>
  </div>
</nav>

<div class="restbar" id="rest" hidden>
  <div class="rest-bar"><i id="rest-fill"></i></div>
  <div class="rest-in">
    <svg class="rest-ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="rr-bg" cx="24" cy="24" r="20"/><circle class="rr-arc" id="rest-arc" cx="24" cy="24" r="20" pathLength="100"/></svg>
    <div class="rest-txt"><div class="rest-lbl" id="rest-lbl">Descanso</div><div class="rest-time" id="rest-time">0:00</div></div>
    <button data-a="rest-add" data-s="-15" aria-label="Menos 15 segundos">−15s</button>
    <button data-a="rest-add" data-s="15" aria-label="Mais 15 segundos">+15s</button>
    <button data-a="rest-skip">Pular</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="f-aval" class="vh" accept="image/*,application/pdf" multiple tabindex="-1" aria-hidden="true">
<input type="file" id="f-ficha" class="vh" accept="image/*,application/pdf" multiple tabindex="-1" aria-hidden="true">
<input type="file" id="f-avatar" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">
<input type="file" id="f-photo" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">

<script type="module" src="/src/main.js"></script>
</body>
</html>
